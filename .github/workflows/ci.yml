name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Only the latest run per ref matters; cancel superseded ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only. No secrets are used, so this also runs for fork PRs.
permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Check-only: never rewrite files in CI, so formatting drift actually fails.
      - name: Format
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck (app)
        run: yarn tsc

      - name: Typecheck (scripts)
        run: yarn tsc:scripts

      - name: Typecheck (rules tests)
        run: yarn tsc:rules

      - name: Test
        run: yarn test --run

      # firestore.rules is the only server-side control on trades, and the
      # trades e2e only drives the valid UI path -- a rule that became too
      # permissive would still pass it. The Firestore emulator needs a JVM.
      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Test security rules
        run: yarn test:rules

      # A renamed or deleted repository variable would otherwise build
      # cleanly and ship `apiKey:void 0`. Skipped for fork PRs, which
      # cannot read repository variables — they still build, just with
      # empty config, which is enough to validate that the build compiles.
      - name: Verify Firebase config
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: ./.github/scripts/check-firebase-env.sh
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}

      # The plan's headline claim is that a signed-out homepage load touches
      # no result collection or season document. It is a network assertion, so
      # only a browser can prove it, and without this step nothing enforces it.
      # Read-only and signed out: the project carries no storageState and no
      # setup dependency, so it needs no secrets and writes nothing. Skipped
      # for fork PRs, which cannot read the Firebase config the page needs to
      # issue any request at all -- the spec's positive control would fail on
      # an app that never connected.
      - name: Install Playwright (chromium)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: yarn playwright install --with-deps chromium

      - name: Test signed-out public reads
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: yarn e2e:pool-public
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}

      - name: Build
        run: yarn build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
