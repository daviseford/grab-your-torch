name: "Sync survivoR data"

# Being replaced by survivor-observer.yml (docs/survivor-observer.md). Until
# the repository variable SURVIVOR_OBSERVER is "live" this keeps running
# daily, in a safe mode: it holds partial episodes, never writes Firestore,
# and never merges its own pull request, so nothing reaches players without
# review. Once the observer is live this job stands down; set the variable
# back to "shadow" (or delete it) to roll back to this workflow.
#
# Merging a pull request from this workflow does not publish it. After
# merging, publish with `yarn tsx scripts/publish-season.ts <season>`, or let
# the live observer adopt the open pull request instead.

on:
  # main only: the job checks out main, so a run from another branch would
  # pair that branch's workflow with main's scripts.
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-survivor-data.yml'
  schedule:
    - cron: '0 14 * * *' # Daily at 14:00 UTC
  workflow_dispatch:

concurrency:
  group: survivor-data-sync
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: vars.SURVIVOR_OBSERVER != 'live'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # --no-push: production is written only after review, never here.
      - name: Run sync script
        run: yarn tsx scripts/sync-season.ts --no-push

      - name: Format generated code
        run: yarn format

      - name: Parse sync result
        id: result
        if: always()
        run: |
          if [ ! -f sync-result.json ]; then
            echo "sync-result.json not found - script may have crashed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "error=sync-result.json not found" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(jq -r '.changed' sync-result.json)
          HELD=$(jq -r '(.held // []) | join("; ")' sync-result.json)
          SEASON=$(jq -r '.seasonNum' sync-result.json)
          IS_NEW=$(jq -r '.isNewSeason' sync-result.json)
          ERROR=$(jq -r '.error // empty' sync-result.json)
          FIRESTORE=$(jq -r '.firestorePushed // false' sync-result.json)
          EPISODES=$(jq -r '.summary.episodes // 0' sync-result.json)
          CHALLENGES=$(jq -r '.summary.challenges // 0' sync-result.json)
          ELIMINATIONS=$(jq -r '.summary.eliminations // 0' sync-result.json)
          EVENTS=$(jq -r '.summary.events // 0' sync-result.json)

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "is_new=$IS_NEW" >> "$GITHUB_OUTPUT"
          echo "error<<ERREOF" >> "$GITHUB_OUTPUT"
          echo "$ERROR" >> "$GITHUB_OUTPUT"
          echo "ERREOF" >> "$GITHUB_OUTPUT"
          echo "firestore=$FIRESTORE" >> "$GITHUB_OUTPUT"
          echo "episodes=$EPISODES" >> "$GITHUB_OUTPUT"
          echo "challenges=$CHALLENGES" >> "$GITHUB_OUTPUT"
          echo "eliminations=$ELIMINATIONS" >> "$GITHUB_OUTPUT"
          echo "events=$EVENTS" >> "$GITHUB_OUTPUT"
          echo "held=$HELD" >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        if: steps.result.outputs.changed == 'true' && steps.result.outputs.error == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEASON: ${{ steps.result.outputs.season }}
          IS_NEW: ${{ steps.result.outputs.is_new }}
          EPISODES: ${{ steps.result.outputs.episodes }}
          CHALLENGES: ${{ steps.result.outputs.challenges }}
          ELIMINATIONS: ${{ steps.result.outputs.eliminations }}
          EVENTS: ${{ steps.result.outputs.events }}
        run: |
          if [ "$IS_NEW" = "true" ]; then
            BRANCH="auto/survivor-new-season-${SEASON}"
            PR_TITLE="feat: bootstrap season ${SEASON} from survivoR"
            COMMIT_MSG="feat: bootstrap season ${SEASON} from survivoR data"
          else
            BRANCH="auto/survivor-sync-season-${SEASON}"
            PR_TITLE="chore: sync season ${SEASON} data from survivoR"
            COMMIT_MSG="chore: sync season ${SEASON} data from survivoR"
          fi

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Always create/recreate branch from current HEAD (main + sync changes).
          # The sync script already wrote the updated files, so we just need to
          # branch, commit, and push. Force-push is safe for bot-managed branches.
          git checkout -B "$BRANCH"

          # Stage and commit
          git add src/data/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "$COMMIT_MSG"
          git push --force-with-lease -u origin "$BRANCH"

          # Create PR if none exists
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING_PR" ]; then
            TYPE_LABEL=$([ "$IS_NEW" = "true" ] && echo "New season bootstrap" || echo "Episode data update")
            PR_BODY="## Automated survivoR data sync"
            PR_BODY="${PR_BODY}\n\n**Season:** ${SEASON}\n**Type:** ${TYPE_LABEL}"
            PR_BODY="${PR_BODY}\n\n### Changes"
            PR_BODY="${PR_BODY}\n- Episodes: ${EPISODES}\n- Challenges: ${CHALLENGES}\n- Eliminations: ${ELIMINATIONS}\n- Events: ${EVENTS}"
            if [ "$IS_NEW" = "true" ]; then
              PR_BODY="${PR_BODY}\n\n### Note\nPlayer images are not available during automated bootstrap. Run \`yarn new-season ${SEASON} --force\` locally to backfill images and bios from the wiki."
            fi
            PR_BODY="${PR_BODY}\n\n**Not published.** Firestore was not touched. Review this, merge it, then run \`yarn tsx scripts/publish-season.ts ${SEASON}\` (or let the live survivoR observer take it over)."
            PR_BODY="${PR_BODY}\n\n---\n*This PR was created automatically by the [survivoR data sync workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).*"

            # Never merged automatically: a person reviews every import.
            gh pr create --title "$PR_TITLE" --body "$(echo -e "$PR_BODY")" --base main
          else
            echo "PR #${EXISTING_PR} already exists for branch ${BRANCH}"
          fi

      - name: Write job summary
        if: always()
        env:
          SEASON: ${{ steps.result.outputs.season }}
          CHANGED: ${{ steps.result.outputs.changed }}
          SYNC_ERROR: ${{ steps.result.outputs.error }}
          FIRESTORE: ${{ steps.result.outputs.firestore }}
          EPISODES: ${{ steps.result.outputs.episodes }}
          CHALLENGES: ${{ steps.result.outputs.challenges }}
          ELIMINATIONS: ${{ steps.result.outputs.eliminations }}
          EVENTS: ${{ steps.result.outputs.events }}
          HELD: ${{ steps.result.outputs.held }}
        run: |
          {
            echo "## survivoR Data Sync"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Season | ${SEASON:-unknown} |"
            echo "| Changes found | ${CHANGED:-unknown} |"
            echo "| Firestore pushed | ${FIRESTORE:-false} |"
            if [ -n "$HELD" ]; then
              echo "| Held (episode not finished upstream) | ${HELD} |"
            fi

            if [ "$CHANGED" = "true" ]; then
              echo "| Episodes | ${EPISODES} |"
              echo "| Challenges | ${CHALLENGES} |"
              echo "| Eliminations | ${ELIMINATIONS} |"
              echo "| Events | ${EVENTS} |"
            fi

            if [ -n "$SYNC_ERROR" ]; then
              echo ""
              echo "### Error"
              echo "\`\`\`"
              echo "$SYNC_ERROR"
              echo "\`\`\`"
            fi

            if [ "$FIRESTORE" = "true" ] && [ "$CHANGED" = "true" ] && [ -n "$SYNC_ERROR" ]; then
              echo ""
              echo "### Divergence"
              echo "Firestore was updated but an error occurred. The codebase may be out of sync."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          rm -f firebase-private-key.json
          rm -f sync-result.json

      - name: Fail on error
        if: always() && steps.result.outputs.error != ''
        env:
          SYNC_ERROR: ${{ steps.result.outputs.error }}
        run: |
          echo "Sync failed: $SYNC_ERROR"
          exit 1
