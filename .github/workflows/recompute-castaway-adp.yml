name: "Recompute castaway ADP"

# Daily refresh of the published castaway average draft position summaries
# (castaway_adp/{season_id}_{cohort}). The job is idempotent: it rewrites a
# summary only when its numbers changed, so an unchanged day writes nothing.
#
# Activation is deliberate, not a side effect of merging: the scheduled run
# does nothing until the repository variable CASTAWAY_ADP_REFRESH is set to
# "enabled" (Settings > Secrets and variables > Actions > Variables). Unset it
# to pause the schedule. A manual workflow_dispatch run always executes, as a
# dry run unless `write` is ticked.
#
# Deliberately never `pull_request`: this job reads
# secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT, and ci.yml is kept secret-free.
on:
  schedule:
    # 09:00 UTC daily: after the Wednesday-night broadcast and the morning
    # data sync, before the US daytime draft traffic.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Season numbers, space separated"
        required: false
        default: "46 47 48 49 50 51"
      write:
        description: "Publish changed summaries (otherwise a dry run)"
        type: boolean
        required: false
        default: false

concurrency:
  group: castaway-adp-recompute
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Reads the repo, writes only to Firestore. No repo or PR writes needed.
permissions:
  contents: read

jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.CASTAWAY_ADP_REFRESH == 'enabled'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Write Firebase service account key
        run: |
          echo '${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT }}' > firebase-private-key.json
          chmod 600 firebase-private-key.json

      # Output is counts only (no ids, names, or castaway figures), so the
      # log is safe to keep. --project pins the write to production; the
      # script refuses if the service account belongs to another project.
      - name: Recompute castaway ADP
        env:
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
          SEASONS: ${{ inputs.seasons || '46 47 48 49 50 51' }}
          WRITE: ${{ github.event_name == 'schedule' || inputs.write }}
        run: |
          ARGS=""
          if [ "$WRITE" = "true" ]; then
            ARGS="--write --project survivor-fantasy-51c4b"
          fi
          yarn recompute-castaway-adp $SEASONS $ARGS

      - name: Cleanup
        if: always()
        run: rm -f firebase-private-key.json
